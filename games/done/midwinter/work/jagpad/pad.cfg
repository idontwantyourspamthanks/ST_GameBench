; Hatari config: Jaguar pad A on the host keys below (nJoystickMode 2 = keyboard emulation), ST joysticks off.
; pad A: Up/Down/Left/Right = w/s/a/d, A = z, B = x (main fire), C = v, Option = o, Pause = p, * = F5, # = F6, 0-9 = digits
; ST joystick 1 (the "real stick", IKBD path) = cursor keys + Right Ctrl: used to compare the stick with the pad in the same run.
[Joystick0]
nJoystickMode = 0
[Joystick1]
nJoystickMode = 2
kUp = Up
kDown = Down
kLeft = Left
kRight = Right
kFire = Right Ctrl
[Joystick2]
nJoystickMode = 2
kUp = W
kDown = S
kLeft = A
kRight = D
kFire = Z
kButtonB = X
kButtonC = V
kButtonOption = O
kButtonPause = P
kButtonStar = F5
kButtonHash = F6
kButton0 = 0
kButton1 = 1
kButton2 = 2
kButton3 = 3
kButton4 = 4
kButton5 = 5
kButton6 = 6
kButton7 = 7
kButton8 = 8
kButton9 = 9
